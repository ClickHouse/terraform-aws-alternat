name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  build_image:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build lambda image
        run: docker build . -t alternat:${{ github.sha }}
